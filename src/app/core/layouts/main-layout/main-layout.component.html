<div class="flex h-screen bg-slate-50">
  <aside class="hidden lg:block">
    <app-sidebar />
  </aside>

  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-slate-900/50" (click)="sidebarOpen.set(false)"></div>
      <aside class="absolute inset-y-0 left-0 z-50 shadow-xl">
        <app-sidebar (navigated)="sidebarOpen.set(false)" />
      </aside>
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-16 shrink-0 items-center border-b border-slate-200 bg-white px-4 lg:px-8">
      <button
        type="button"
        class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden"
        aria-label="Open menu"
        (click)="sidebarOpen.set(true)"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <button
        type="button"
        class="ml-auto flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
