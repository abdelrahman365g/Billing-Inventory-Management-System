<div class="p-6">
  <h2 class="text-lg font-semibold text-slate-800">{{ data.title }}</h2>
  <p class="mt-3 text-sm text-slate-600">{{ data.message }}</p>

  @if (errorMessage()) {
    <div role="alert" class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
      {{ errorMessage() }}
    </div>
  }

  <div class="mt-6 flex justify-end gap-3">
    <button
      type="button"
      (click)="cancel()"
      [disabled]="busy()"
      class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ errorMessage() ? 'Close' : 'Cancel' }}
    </button>

    <button
      type="button"
      (click)="confirm()"
      [disabled]="busy()"
      class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ busy() ? 'Deleting...' : (data.confirmLabel ?? 'Delete') }}
    </button>
  </div>
</div>
