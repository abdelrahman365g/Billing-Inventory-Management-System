<h1 class="text-xl font-semibold text-slate-800">Sign in</h1>

<form [formRoot]="loginForm" class="mt-6 space-y-5">
  <div>
    <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      [formField]="loginForm.email"
      class="mt-1 block w-full rounded-lg border px-3 py-2 text-sm shadow-sm outline-none focus:ring-2 focus:ring-indigo-500"
      [class]="loginForm.email().touched() && loginForm.email().invalid() ? 'border-red-500' : 'border-slate-300'"
    />
    @if (loginForm.email().touched() && loginForm.email().invalid()) {
      <p class="mt-1 text-xs text-red-600">{{ loginForm.email().errors()[0]?.message }}</p>
    }
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
    <div class="relative mt-1">
      <input
        id="password"
        autocomplete="current-password"
        [type]="hidePassword() ? 'password' : 'text'"
        [formField]="loginForm.password"
        class="block w-full rounded-lg border px-3 py-2 pr-11 text-sm shadow-sm outline-none focus:ring-2 focus:ring-indigo-500"
        [class]="loginForm.password().touched() && loginForm.password().invalid() ? 'border-red-500' : 'border-slate-300'"
      />
      <button
        type="button"
        class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 hover:text-slate-700"
        aria-label="Toggle password visibility"
        (click)="hidePassword.set(!hidePassword())"
      >
        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>
    @if (loginForm.password().touched() && loginForm.password().invalid()) {
      <p class="mt-1 text-xs text-red-600">{{ loginForm.password().errors()[0]?.message }}</p>
    }
  </div>

  @if (errorMessage()) {
    <div role="alert" class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
      {{ errorMessage() }}
    </div>
  }

  <button
    type="submit"
    [disabled]="loginForm().submitting()"
    class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
  >
    {{ loginForm().submitting() ? 'Signing in...' : 'Sign in' }}
  </button>
</form>
